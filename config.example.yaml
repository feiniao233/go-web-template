http:
  addr: ":8080"
  prefix: "/api/v1"
  read_header_timeout: 5s
  read_timeout: 15s
  write_timeout: 30s
  idle_timeout: 60s
  max_header_bytes: 1048576
  gin_mode: release

database:
  dsn: ""
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: 30m
  slow_threshold: 200ms
  log_level: warn
  migrate_on_start: true

telemetry:
  clickhouse_dsn: ""
  tdengine_dsn: ""
  max_open_conns: 10
  max_idle_conns: 5
  conn_max_lifetime: 30m

redis:
  url: ""

mqtt:
  url: ""
  client_id: service
  username: ""
  password: ""
  connect_timeout: 10s
  keep_alive: 30s

cors:
  allowed_origins:
    - "*"
  allow_credentials: false

log:
  level: info
  file: ""

shutdown_timeout: 10s
